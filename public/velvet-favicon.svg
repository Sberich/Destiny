<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="velvetBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0d38" />
      <stop offset="65%" stop-color="#12061c" />
      <stop offset="100%" stop-color="#07020b" />
    </radialGradient>

    <!-- Rose Gold Rim Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5c2" />
      <stop offset="35%" stop-color="#e29578" />
      <stop offset="70%" stop-color="#b86b53" />
      <stop offset="100%" stop-color="#f5cfbc" />
    </linearGradient>

    <!-- Passion Neon Gradient -->
    <linearGradient id="passionGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e93" />
      <stop offset="50%" stop-color="#e29578" />
      <stop offset="100%" stop-color="#ffe5b4" />
    </linearGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#e29578" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Velvet Canvas -->
  <circle cx="256" cy="256" r="248" fill="url(#velvetBg)" stroke="url(#roseGold)" stroke-width="12" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="rgba(226, 149, 120, 0.28)" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Entwined Romantic Heart-Infinity Knot Emblem -->
  <g filter="url(#softGlow)" fill="none" stroke="url(#passionGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Infinity Heart Loop -->
    <path d="M256,290 C220,340 130,370 95,305 C60,240 100,165 175,175 C220,180 245,230 256,256 C267,230 292,180 337,175 C412,165 452,240 417,305 C382,370 292,340 256,290 Z" />
  </g>

  <!-- Second Pass Highlight Line -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <path d="M110,290 C85,245 115,185 175,185 C210,185 235,225 256,256" />
    <path d="M402,290 C427,245 397,185 337,185 C302,185 277,225 256,256" />
  </g>

  <!-- Central Diamond Stardust Star (✦) -->
  <g transform="translate(256, 256)" filter="url(#starGlow)">
    <!-- 8-point Diamond Star -->
    <path d="M0,-62 Q0,0 62,0 Q0,0 0,62 Q0,0 -62,0 Q0,0 0,-62 Z" fill="url(#starGold)" />
    <!-- Diagonal smaller flares -->
    <path d="M0,-28 Q0,0 28,0 Q0,0 0,28 Q0,0 -28,0 Q0,0 0,-28 Z" fill="#ffffff" transform="rotate(45)" opacity="0.9" />
    <!-- Center Jewel Spark -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Ambient Tiny Stardust Pearls -->
  <circle cx="160" cy="115" r="4.5" fill="#ffd166" opacity="0.75" />
  <circle cx="352" cy="115" r="4.5" fill="#ffd166" opacity="0.75" />
  <circle cx="256" cy="400" r="5" fill="#ff2e93" opacity="0.8" />
  <circle cx="95" cy="220" r="3.5" fill="#ffffff" opacity="0.6" />
  <circle cx="417" cy="220" r="3.5" fill="#ffffff" opacity="0.6" />
</svg>
